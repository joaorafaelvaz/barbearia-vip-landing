# /etc/nginx/sites-available/indicacao.barbeariavip.com.br
# Ative com: ln -s /etc/nginx/sites-available/indicacao.barbeariavip.com.br /etc/nginx/sites-enabled/
# TLS: certbot --nginx -d indicacao.barbeariavip.com.br (o certbot reescreve este bloco com o 443)

upstream bvip_landing {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name indicacao.barbeariavip.com.br;

    client_max_body_size 1m;

    # Assets com hash: cache longo
    location /_next/static/ {
        proxy_pass http://bvip_landing;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://bvip_landing;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # O app lê X-Forwarded-For para rate limit e hash de IP: este header precisa vir do nginx, não do cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
